# Rust crates that the adblock engine adds to Chromium's vendored set (scripts/vendor-adblock-crates.ps1), one per line:
#   <directory in third_party/rust/chromium_crates_io/vendor> <crate version> <SHA-256 over the tree>
# The tree hash covers the path and SHA-256 of every file (scripts/check-crates.py). A crate that is not here, or whose
# version or tree differs, stops the build.
# Review before adding a line: download https://static.crates.io/crates/<name>/<name>-<version>.crate, unpack it and compare
# it with the vendored directory; only the files our patches add (LICENSE of seahash and flatbuffers) may differ.
