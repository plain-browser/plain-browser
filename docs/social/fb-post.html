<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Segoe UI","Inter","Noto Sans","DejaVu Sans",system-ui,sans-serif;color:#e8eaee;
 background:radial-gradient(900px 600px at 85% 40%,#1b3a78 0%,rgba(27,58,120,0) 70%),#0f1217;position:relative}
.left{position:absolute;left:64px;top:56px;width:560px}
.brand{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:600;letter-spacing:-.01em}
.brand img{width:56px;height:56px}
h1{margin-top:36px;white-space:nowrap;font-size:44px;line-height:1.08;font-weight:700;letter-spacing:-.025em}
h1 span{color:#6ea0ff}
ul{list-style:none;margin-top:32px;display:grid;gap:14px;font-size:22px;color:#cfd4dc}
li{display:flex;align-items:center;gap:14px}
li svg{flex:none;width:28px;height:28px}
.foot{position:absolute;left:64px;bottom:44px;font-size:19px;color:#9aa3b0}
.foot b{color:#e8eaee;font-weight:600}
.shot{position:absolute;right:48px;top:130px;width:500px;height:314px;border-radius:14px;overflow:hidden;
 border:1px solid #2c3440;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.shot img{position:absolute;left:-1488px;top:0;width:1988px}
.cap{position:absolute;right:48px;top:464px;width:500px;text-align:center;white-space:nowrap;font-size:18px;color:#9aa3b0}
</style></head><body>
<div class="left">
 <div class="brand"><img src="../../branding/icons/product_logo.svg">Plain Browser</div>
 <h1>Zwykła przeglądarka.<br><span>Bez Google.<br>Bez reklam.</span></h1>
 <ul>
  <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2D6CDF"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Wbudowany bloker reklam i trackerów</li>
  <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2D6CDF"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Bez konta, synchronizacji i telemetrii</li>
  <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2D6CDF"/><path d="M6.5 12.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Rozszerzenia Manifest V2 nadal działają</li>
 </ul>
</div>
<div class="foot"><b>Windows 11</b> · Open Source · beta &nbsp;|&nbsp; plain-browser.app</div>
<div class="shot"><img src="../store-screenshots/03-shields-bubble.png"></div>
<div class="cap">Jeden przycisk: ochrona dla bieżącej strony</div>
</body></html>
