<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, Segoe UI, sans-serif">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#9fb0c3"/></marker></defs>
  <rect width="1920" height="1080" fill="#0f1419"/>
  <text x="960" y="100" text-anchor="middle" fill="#e6edf3" font-size="56" font-weight="600">Droga jednego żądania</text>
  <g id="renderer"><rect x="100" y="300" width="480" height="420" rx="16" fill="#1f2a37" stroke="#3b4a5c" stroke-width="3"/>
    <text x="340" y="360" text-anchor="middle" fill="#e6edf3" font-size="36" font-weight="600">Renderer (karta)</text>
    <text x="130" y="430" fill="#9fb0c3" font-size="26">strona chce pobrać ads.js</text>
    <rect x="130" y="470" width="420" height="70" rx="10" fill="#2b3a4d"/><text x="340" y="515" text-anchor="middle" fill="#e6edf3" font-size="26">AdblockURLLoaderThrottle</text>
    <text x="130" y="590" fill="#9fb0c3" font-size="26">zatrzymuje żądanie, pyta</text>
    <rect x="130" y="620" width="420" height="70" rx="10" fill="#2b3a4d"/><text x="340" y="665" text-anchor="middle" fill="#e6edf3" font-size="26">CosmeticFilterAgent (CSS)</text></g>
  <g id="browser"><rect x="720" y="300" width="480" height="420" rx="16" fill="#1f2a37" stroke="#3b4a5c" stroke-width="3"/>
    <text x="960" y="360" text-anchor="middle" fill="#e6edf3" font-size="36" font-weight="600">Proces przeglądarki</text>
    <rect x="750" y="470" width="420" height="70" rx="10" fill="#2b3a4d"/><text x="960" y="515" text-anchor="middle" fill="#e6edf3" font-size="26">AdBlockService</text>
    <text x="750" y="590" fill="#9fb0c3" font-size="26">wyjątki per site, licznik</text>
    <text x="750" y="630" fill="#9fb0c3" font-size="26">fail open po 3 s</text></g>
  <g id="engine"><rect x="1340" y="300" width="480" height="420" rx="16" fill="#163a2a" stroke="#2ea043" stroke-width="4"/>
    <text x="1580" y="360" text-anchor="middle" fill="#e6edf3" font-size="36" font-weight="600">Proces adblocka</text>
    <text x="1580" y="400" text-anchor="middle" fill="#b7e3c3" font-size="24">piaskownica kService</text>
    <rect x="1370" y="470" width="420" height="70" rx="10" fill="#1d4d35"/><text x="1580" y="515" text-anchor="middle" fill="#e6edf3" font-size="26">adblock-rust (cxx)</text>
    <text x="1370" y="590" fill="#b7e3c3" font-size="26">EasyList, EasyPrivacy, PL</text>
    <text x="1370" y="630" fill="#b7e3c3" font-size="26">parsuje listy tylko tutaj</text></g>
  <path d="M580,505 L720,505" stroke="#9fb0c3" stroke-width="5" marker-end="url(#a)"/>
  <path d="M1200,505 L1340,505" stroke="#9fb0c3" stroke-width="5" marker-end="url(#a)"/>
  <text x="650" y="480" text-anchor="middle" fill="#9fb0c3" font-size="22">mojo</text>
  <text x="1270" y="480" text-anchor="middle" fill="#9fb0c3" font-size="22">mojo</text>
  <path d="M1340,560 L720,560" stroke="#2ea043" stroke-width="5" marker-end="url(#a)"/>
  <path d="M720,560 L580,560" stroke="#2ea043" stroke-width="5" marker-end="url(#a)"/>
  <text x="960" y="800" text-anchor="middle" fill="#e6edf3" font-size="34">odpowiedź: <tspan fill="#f85149">blok</tspan> · <tspan fill="#2ea043">przepuść</tspan> · <tspan fill="#d29922">redirect do atrapy</tspan></text>
  <text x="960" y="1000" text-anchor="middle" fill="#9fb0c3" font-size="28">Pada proces adblocka? Następne zapytanie uruchamia go na nowo, z wbudowanymi listami. Najwyżej 4 starty na sesję.</text>
</svg>
