name = "plainbrowser-crash-reports"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The zone plain-browser.app must be on Cloudflare. //plainbrowser/crash (crash::kUploadUrl) points Crashpad at
# https://crash.plain-browser.app/report.
routes = [
  { pattern = "crash.plain-browser.app", custom_domain = true }
]

# Reports (minidump plus a small JSON of its form fields). Create the bucket once:
#   npx wrangler r2 bucket create plainbrowser-crash-reports
# and give it a lifecycle rule that deletes objects after 90 days (README.md, "Deploy").
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "plainbrowser-crash-reports"

# Do not keep request logs. Aggregate metrics in the dashboard are enough.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

# Rate limit per client IP: 5 reports per 60 s. Crashpad uploads at most one report an hour per install.
# namespace_id: any unique integer in your account (the Safe Browsing proxy uses 1001, the list mirror 1002).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }
