name = "plainbrowser-sb-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The zone plain-browser.app must be on Cloudflare. patches/70-safebrowsing points the browser here.
routes = [
  { pattern = "sb.plain-browser.app", custom_domain = true }
]

# Do not keep request logs. Aggregate metrics in the dashboard are enough.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

# Rate limit per client IP: 60 requests per 60 s. Safe Browsing clients poll every 30 min or more.
# Create the namespace_id yourself; any unique integer in your account.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
# Only accept `X-Client: PlainBrowser/<major.minor.patch>` (the browser sends it, patches/70-safebrowsing).
# Not authentication, just a cheap filter against random scanners.
REQUIRED_CLIENT = "PlainBrowser"

# The Google API key is a secret, never put it here:
#   npx wrangler secret put GOOGLE_SB_KEY
