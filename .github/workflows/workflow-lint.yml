name: workflow-lint
# zizmor (https://docs.zizmor.sh) on the workflows and Dependabot configuration: template injection, excessive
# permissions, unpinned actions, secrets outside an environment, cache poisoning. Fails on a finding, so a workflow
# change that weakens something does not merge unnoticed. Run it locally: uvx zizmor .github
on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]
  workflow_dispatch:
permissions: {}
jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: regular
          advanced-security: false
