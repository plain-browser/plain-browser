name: upstream-watch
# Opens an issue when ungoogled-chromium-windows publishes a tag newer than the one pinned in versions.toml,
# with a dry-run of patches/series against that tag (scripts/check-patches.py) so the issue already says which
# patches need work. Stale Chromium is the main security risk of this project; the goal is to ship within a few
# days of an upstream tag.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare pinned and latest upstream tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^ungoogled_chromium_windows *= *"\([^"]*\)".*/\1/p' versions.toml)
          latest=$(gh api repos/ungoogled-software/ungoogled-chromium-windows/tags --jq '.[].name' | sort -V | tail -1)
          echo "pinned=$current latest=$latest"
          if [ -z "$current" ] || [ -z "$latest" ]; then echo "could not read a version"; exit 1; fi
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$current" ]; then
            echo "up to date"; exit 0
          fi
          title="Upstream update: ungoogled-chromium-windows $latest"
          if [ -n "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            echo "issue already open"; exit 0
          fi
          # Dry-run our patches against the new tag; a failure here is the content of the issue, not an error.
          python3 -I scripts/check-patches.py --tag "$latest" --report report.md || true
          {
            echo "Pinned: \`$current\`. Latest upstream tag: \`$latest\`."
            echo
            echo "Steps: bump versions.toml, run scripts/apply-plainbrowser.ps1 (all patches must apply), rerun scripts/vendor-adblock-crates.ps1, build, run scripts/test-adblock.ps1. Check the upstream Chromium release notes for security fixes that our patches could interfere with."
            echo
            cat report.md
          } > body.md
          gh issue create --title "$title" --body-file body.md
