name: scorecard
# OpenSSF Scorecard (https://securityscorecards.dev): scores the repository's own supply-chain hygiene (branch
# rules, pinned dependencies, token permissions, signed releases, ...). Results: Security > Code scanning, and the
# public badge data. Weekly and on every push to main.
on:
  branch_protection_rule:
  schedule:
    - cron: "37 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write   # uploads the results
      id-token: write          # publishes the result with this run's identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
          category: scorecard
