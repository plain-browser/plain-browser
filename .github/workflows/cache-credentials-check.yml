name: cache-credentials-check
# Run by hand (Actions > cache-credentials-check > Run workflow, on main) after the compile cache credentials change:
# a few seconds against the R2 bucket instead of finding a typo after a 6-hour build (docs/BUILD_CACHE.md).
#   read-only  the repository secrets SCCACHE_RO_*: can list the cache bucket, cannot write to it, cannot reach the
#              extensions bucket.
#   read-write the secrets of the environment `build` (main and v* tags only): can write, read back and delete an object
#              in the cache bucket, cannot reach the extensions bucket.
# The test object lives under diagnostics/ and is deleted again. Secrets are never printed.
on:
  workflow_dispatch:
permissions: {}
env:
  BUCKET: ${{ vars.SCCACHE_BUCKET }}
  ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  # R2 and the AWS CLI: region `auto`, and no extra checksums (newer CLIs add them and R2 refuses some of them)
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment: build-readonly
    steps:
      - name: The read-only credentials read and do not write
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_RO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_RO_SECRET_ACCESS_KEY }}
        run: |
          fail=0
          ok()  { echo "ok   $*"; echo "- ok: $*" >> "$GITHUB_STEP_SUMMARY"; }
          bad() { echo "::error::$*"; echo "- **FAIL**: $*" >> "$GITHUB_STEP_SUMMARY"; fail=1; }
          [ -n "$BUCKET" ] && [ -n "$ENDPOINT" ] || { echo "::error::variables SCCACHE_BUCKET and SCCACHE_ENDPOINT are not set"; exit 1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::SCCACHE_RO_* secrets are not set"; exit 1; }
          s3api() { aws --endpoint-url "$ENDPOINT" s3api "$@"; }
          echo "read-only credentials, bucket $BUCKET" >> "$GITHUB_STEP_SUMMARY"
          if s3api list-objects-v2 --bucket "$BUCKET" --max-items 1 > /dev/null 2> err.txt; then
            ok "can list $BUCKET"
          else
            bad "cannot list $BUCKET: $(tail -n 1 err.txt | cut -c1-160)"
          fi
          echo probe > probe.txt
          key="diagnostics/ro-probe-$GITHUB_RUN_ID"
          if s3api put-object --bucket "$BUCKET" --key "$key" --body probe.txt > /dev/null 2> err.txt; then
            bad "the read-only credentials can WRITE to $BUCKET (they must not): the token is Object Read & Write"
            s3api delete-object --bucket "$BUCKET" --key "$key" > /dev/null 2>&1 || true
          else
            ok "cannot write, as intended ($(tail -n 1 err.txt | cut -c1-100))"
          fi
          if s3api list-objects-v2 --bucket plainbrowser-extensions --max-items 1 > /dev/null 2> err.txt; then
            bad "can list plainbrowser-extensions: the token is not limited to the cache bucket"
          else
            ok "no access to plainbrowser-extensions, as intended"
          fi
          exit $fail
  read-write:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # main and v* tags only; on another branch the run is refused, which is the point of the environment
    environment: build
    steps:
      - name: The read-write credentials read, write and delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
        run: |
          fail=0
          ok()  { echo "ok   $*"; echo "- ok: $*" >> "$GITHUB_STEP_SUMMARY"; }
          bad() { echo "::error::$*"; echo "- **FAIL**: $*" >> "$GITHUB_STEP_SUMMARY"; fail=1; }
          [ -n "$BUCKET" ] && [ -n "$ENDPOINT" ] || { echo "::error::variables SCCACHE_BUCKET and SCCACHE_ENDPOINT are not set"; exit 1; }
          [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::SCCACHE_ACCESS_KEY_ID/SECRET_ACCESS_KEY of the environment build are not set"; exit 1; }
          s3api() { aws --endpoint-url "$ENDPOINT" s3api "$@"; }
          echo "read-write credentials, bucket $BUCKET" >> "$GITHUB_STEP_SUMMARY"
          key="diagnostics/rw-probe-$GITHUB_RUN_ID"
          echo "probe $GITHUB_RUN_ID" > probe.txt
          if s3api put-object --bucket "$BUCKET" --key "$key" --body probe.txt > /dev/null 2> err.txt; then
            ok "wrote $key"
            if s3api get-object --bucket "$BUCKET" --key "$key" back.txt > /dev/null 2> err.txt && cmp -s probe.txt back.txt; then
              ok "read it back unchanged"
            else
              bad "could not read the object back: $(tail -n 1 err.txt | cut -c1-160)"
            fi
            if s3api delete-object --bucket "$BUCKET" --key "$key" > /dev/null 2> err.txt; then
              ok "deleted it again"
            else
              bad "could not delete $key: $(tail -n 1 err.txt | cut -c1-160)"
            fi
          else
            bad "cannot write to $BUCKET: $(tail -n 1 err.txt | cut -c1-160)"
          fi
          if s3api list-objects-v2 --bucket plainbrowser-extensions --max-items 1 > /dev/null 2> err.txt; then
            bad "can list plainbrowser-extensions: the token is not limited to the cache bucket"
          else
            ok "no access to plainbrowser-extensions, as intended"
          fi
          exit $fail
