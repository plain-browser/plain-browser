name: dependency-review
# On a pull request: new or changed dependencies (npm, cargo, pip, GitHub Actions) with a known vulnerability of high
# severity or worse fail the check. The dependency graph of this public repository is the data source.
on:
  pull_request:
permissions: {}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
