name: pipeline
# The release pipeline, one pass every 20 minutes at best (GitHub treats the schedule as best effort) (scripts/ci/pipeline.py, docs/CI.md "Release pipeline"): a new
# ungoogled-chromium-windows tag becomes a release (version bump on main, tag, build-windows), a failed build is rerun
# or reported, a finished build is signed (sign-release.yml) and submitted to Microsoft Store certification
# (store-submit.yml), and the release is then published. Everything is derived from GitHub state, so a pass that
# dies half way is finished by the next one. Stop it with the repository variable PIPELINE_ENABLED=false.
# Events made with GITHUB_TOKEN start nothing, except workflow_dispatch: that is why the pipeline dispatches the
# other workflows instead of relying on tag pushes and published releases.
on:
  schedule:
    - cron: "7,27,47 * * * *"   # GitHub delays or drops scheduled runs (observed: hours); several a hour makes one likely
  workflow_dispatch:
    inputs:
      selftest:
        description: "Only check that a commit made through the API with this token is signed (scratch branch)"
        type: boolean
        default: false
permissions:
  contents: write   # signed version-bump commit on main, tag, release edit
  actions: write    # dispatch and rerun workflows
  issues: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Pass
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SELFTEST: ${{ inputs.selftest }}
        run: |
          set -euo pipefail
          if [ "$SELFTEST" = true ]; then python3 -I scripts/ci/pipeline.py selftest; else python3 -I scripts/ci/pipeline.py; fi
