name: build-windows
# Plain Browser build on GitHub-hosted Windows runners, in chained stages (docs/CI.md).
# A Chromium build takes far longer than the 6-hour job limit, so the build runs the way ungoogled-chromium-windows'
# own CI does: `build.py --ci` compiles for 3.5 hours and exits 124, the job zips the tree and uploads it as an
# artifact, and the next job downloads it and resumes; a stage that finishes packages the browser instead.
# Stages that are no longer needed are skipped (no runner is started). Alpha builds need about 6 stages; the
# official profile (ThinLTO + PGO) is not expected to fit in 10, see docs/CI.md.
# Manual runs and version tags only, never pull_request: the tree is built from the pushed revision with network
# access, and a tag run creates a draft release for sign-release.yml to sign.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: alpha (default; no official build, PGO or LTO) or official (upstream flags, many more stages)"
        type: choice
        options: [alpha, official]
        default: alpha
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  PROFILE: ${{ inputs.profile || 'alpha' }}
  # Same absolute path on every runner of a run: args.gn and the ninja logs in the handed-over tree contain it.
  PB_WORK: C:\pb

defaults:
  run:
    shell: pwsh

jobs:
  # Stage 0: tree with the ungoogled-chromium and Plain Browser layers applied, vendored adblock crates, no GN yet.
  # The tree depends only on the pinned upstream tag, our patches and sources and the profile, so it is reused from
  # an earlier run when an artifact for the same inputs still exists (about an hour saved, mostly the Chromium clone).
  prepare:
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    outputs:
      tree_name: ${{ steps.lookup.outputs.tree_name }}
      tree_run_id: ${{ steps.lookup.outputs.tree_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for a tree-0 artifact built from the same inputs
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Everything prepare-tree.ps1 reads: the pinned tag and version, patches, our sources, branding, the
          # Python and PowerShell helpers it calls, and the profile (flags.windows.gn differs).
          TREE_NAME: tree-0-${{ env.PROFILE }}-${{ hashFiles('versions.toml', 'patches/**', 'src/**', 'branding/**', 'scripts/*.py', 'scripts/*.ps1', 'scripts/ci/common.ps1', 'scripts/ci/install-tools.ps1', 'scripts/ci/prepare-tree.ps1') }}
        run: |
          $runId = gh api "repos/$env:REPO/actions/artifacts?name=$env:TREE_NAME&per_page=20" `
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // ""'
          if ($LASTEXITCODE -ne 0) { throw "artifact lookup failed" }
          if ($runId) {
            Write-Host "reusing $env:TREE_NAME from run $runId"
            "Reused tree-0 from run $runId ($env:TREE_NAME)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "no usable $env:TREE_NAME: preparing the tree"
            $runId = "${{ github.run_id }}"
          }
          "tree_name=$env:TREE_NAME" >> $env:GITHUB_OUTPUT
          "tree_run_id=$runId" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.lookup.outputs.tree_run_id == github.run_id
        with:
          python-version: "3.12"
      - name: Install tools (Windows SDK 10.0.28000, Python modules)
        if: steps.lookup.outputs.tree_run_id == github.run_id
        run: ./scripts/ci/install-tools.ps1 -Work $env:PB_WORK
      - name: Prepare the tree (clone, patches, branding, adblock crates)
        if: steps.lookup.outputs.tree_run_id == github.run_id
        run: ./scripts/ci/prepare-tree.ps1 -Work $env:PB_WORK -Profile $env:PROFILE
      - name: Save the tree for stage 1
        if: steps.lookup.outputs.tree_run_id == github.run_id
        run: ./scripts/ci/pack-tree.ps1 -Work $env:PB_WORK
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lookup.outputs.tree_run_id == github.run_id
        with:
          name: ${{ steps.lookup.outputs.tree_name }}
          path: C:\pb\tree.zip
          compression-level: 0
          # Kept for reuse by later runs (cleanup leaves tree-0-* alone); the per-stage trees expire after 2 days.
          retention-days: 14
          if-no-files-found: error

  # Stage 1: resume ninja for one time slice; hand the tree on, or package when the build finished.
  build-1:
    needs: prepare
    # Stage 1 also writes args.gn and runs gn gen and bindgen (build.py --ci does that on its first pass).
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read   # the tree-0 artifact may belong to an earlier run
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: ./scripts/ci/install-tools.ps1 -Work $env:PB_WORK
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.tree_name }}
          run-id: ${{ needs.prepare.outputs.tree_run_id }}
          github-token: ${{ github.token }}
          path: C:\pb
      - name: Restore the tree
        run: ./scripts/ci/unpack-tree.ps1 -Work $env:PB_WORK
      - name: Build (one ninja time slice)
        id: stage
        run: ./scripts/ci/build-stage.ps1 -Work $env:PB_WORK -Profile $env:PROFILE
      - name: Save the tree for stage 2
        if: steps.stage.outputs.finished != 'true'
        run: ./scripts/ci/pack-tree.ps1 -Work $env:PB_WORK
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.stage.outputs.finished != 'true'
        with:
          name: tree-1
          path: C:\pb\tree.zip
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Package (zip, installer, MSIX, SHA256SUMS.txt)
        if: steps.stage.outputs.finished == 'true'
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: ./scripts/ci/package.ps1 -Work $env:PB_WORK
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.stage.outputs.finished == 'true'
        with:
          name: plainbrowser-${{ env.PROFILE }}
          path: C:\pb\dist
          retention-days: 14
          if-no-files-found: error

  # Stage 2: resume ninja for one time slice; hand the tree on, or package when the build finished.
  build-2:
    needs: build-1
    # Skipped (no runner) once an earlier stage finished the build.
    if: needs.build-1.outputs.finished != 'true'
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
