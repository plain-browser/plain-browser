name: sign-release
run-name: sign-release ${{ inputs.tag }}
# Started by scripts/ci/pipeline.py once a build has produced a draft release, or by hand. Takes the assets already attached to a GitHub release (built and uploaded by the maintainer),
# writes SHA256SUMS and adds a keyless cosign signature bundle per file, tied to this workflow's OIDC identity.
# This proves who published the files and that they were not altered afterwards. It does NOT prove how they were built
# (release builds have so far run on our own builder; build-windows.yml is the first step towards builds in Actions), so it is deliberately not called build provenance.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose assets to sign"
        required: true
permissions: {}
jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # uploads the signatures to the release
      id-token: write   # keyless cosign: the signature carries this workflow's OIDC identity
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download, checksum, sign, upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "::error::unexpected tag: $TAG"; exit 1; }
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$REPO" --pattern '*' --clobber
          rm -f SHA256SUMS.txt *.bundle
          # Only files that build-windows.yml made from this tag are signed: a signature says who published the files,
          # so without this a file added to the draft by hand would carry our signature too.
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          for f in *; do
            gh attestation verify "$f" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/build-windows.yml" \
              --source-ref "refs/tags/$TAG" --source-digest "$sha" > /dev/null \
              || { echo "::error::$f has no valid build provenance for $TAG ($sha): not signing"; exit 1; }
          done
          sha256sum * > SHA256SUMS.txt
          for f in *; do
            case "$f" in *.bundle) continue;; esac
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
          # Verify every bundle with the exact command SECURITY.md gives users, before anything is uploaded.
          for f in *; do
            case "$f" in *.bundle) continue;; esac
            cosign verify-blob --bundle "$f.bundle" \
              --certificate-identity "https://github.com/$REPO/.github/workflows/sign-release.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          sha256sum -c SHA256SUMS.txt
          gh release upload "$TAG" --repo "$REPO" --clobber SHA256SUMS.txt *.bundle
          echo "signed and verified: $(ls *.bundle | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
