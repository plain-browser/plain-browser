name: sign-release
# Manual. Takes the assets already attached to a GitHub release (built and uploaded by the maintainer),
# writes SHA256SUMS and adds a keyless cosign signature bundle per file, tied to this workflow's OIDC identity.
# This proves who published the files and that they were not altered afterwards. It does NOT prove how they were built
# (release builds have so far run on our own builder; build-windows.yml is the first step towards builds in Actions), so it is deliberately not called build provenance.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose assets to sign"
        required: true
permissions:
  contents: write
  id-token: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download, checksum, sign, upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$REPO" --pattern '*' --clobber
          rm -f SHA256SUMS.txt *.bundle
          sha256sum * > SHA256SUMS.txt
          for f in *; do
            case "$f" in *.bundle) continue;; esac
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
          # Verify every bundle with the exact command SECURITY.md gives users, before anything is uploaded.
          for f in *; do
            case "$f" in *.bundle) continue;; esac
            cosign verify-blob --bundle "$f.bundle" \
              --certificate-identity "https://github.com/$REPO/.github/workflows/sign-release.yml@$GITHUB_REF" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          sha256sum -c SHA256SUMS.txt
          gh release upload "$TAG" --repo "$REPO" --clobber SHA256SUMS.txt *.bundle
          echo "signed and verified: $(ls *.bundle | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
