name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/PRIVACY*.md"
      - "SECURITY.md"
      - "docs/SECURITY.pl.md"
      - "versions.toml"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: website/out
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: website
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: out
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Upload to the bucket
        env:
          BUCKET: ${{ vars.GCS_BUCKET || 'plain-browser.app' }}
        run: |
          gcloud storage rsync out "gs://$BUCKET" --recursive --delete-unmatched-destination-objects --exclude='^_next/static/.*'
          gcloud storage rsync out/_next/static "gs://$BUCKET/_next/static" --recursive --delete-unmatched-destination-objects \
            --cache-control='public, max-age=31536000, immutable'
          gcloud storage objects update "gs://$BUCKET/**.html" --cache-control='public, max-age=300' --quiet
      - name: Purge Cloudflare cache
        if: vars.CLOUDFLARE_ZONE_ID != ''
        env:
          CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
