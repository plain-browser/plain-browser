name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/PRIVACY*.md"
      - "SECURITY.md"
      - "docs/SECURITY.pl.md"
      - "versions.toml"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: website/out
          retention-days: 7

  deploy:
    needs: build
    # Skipped until the GCP variables exist (docs/GITHUB_SETUP.md, section 4); the build job still checks the site.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: website
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation to Google Cloud
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Upload to the bucket
        env:
          BUCKET: ${{ vars.GCS_BUCKET || 'plain-browser.app' }}
        run: |
          gcloud storage rsync out "gs://$BUCKET" --recursive --delete-unmatched-destination-objects --exclude='^_next/static/.*'
          gcloud storage rsync out/_next/static "gs://$BUCKET/_next/static" --recursive --delete-unmatched-destination-objects \
            --cache-control='public, max-age=31536000, immutable'
          gcloud storage objects update "gs://$BUCKET/**.html" --cache-control='public, max-age=300' --quiet
      - name: Purge Cloudflare cache
        if: vars.CLOUDFLARE_ZONE_ID != ''
        env:
          CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
