name: extensions
# Builds the curated extensions (infra/extensions) from their latest upstream releases, signs them with the
# extension keys and uploads them to the R2 bucket behind ext.plain-browser.app.
on:
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC
  workflow_dispatch:
    inputs:
      first_build:
        description: "Nothing published yet: do not read the live catalog.json"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: extensions
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: npm test
      - name: Build and sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXT_KEY_UBLOCK: ${{ secrets.EXT_KEY_UBLOCK }}
          EXT_KEY_UMATRIX: ${{ secrets.EXT_KEY_UMATRIX }}
          EXT_KEY_NOSCRIPT: ${{ secrets.EXT_KEY_NOSCRIPT }}
          EXT_KEY_ADGUARD: ${{ secrets.EXT_KEY_ADGUARD }}
          FIRST_BUILD: ${{ inputs.first_build }}
        run: |
          if [ "$FIRST_BUILD" = "true" ]; then
            node scripts/build.mjs --out dist --previous none
          else
            node scripts/build.mjs --out dist
          fi
      - name: Publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; built but not published"
            exit 0
          fi
          node scripts/publish.mjs --dist dist
