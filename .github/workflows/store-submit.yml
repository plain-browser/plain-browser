name: store-submit
# the exact title is how scripts/ci/pipeline.py finds the real submissions; diagnose and draft runs get a suffix
run-name: store-submit ${{ inputs.tag }}${{ (inputs.diagnose || !inputs.commit) && ' (draft)' || '' }}
# Sends the MSIX of a GitHub release to Microsoft Store certification (docs/CI.md, "Microsoft Store"). Started by
# scripts/ci/pipeline.py (every hour, after sign-release.yml) or by hand for any tag. Nothing here waits for a person:
# the `store` environment only limits which branch may read the Partner Center secrets (main).
# Needs: a release already signed by sign-release.yml (SHA256SUMS.txt and cosign bundles), the Store product created
# and submitted once by hand in Partner Center, and the variables and secrets of docs/GITHUB_SETUP.md section 5.
# A submission of an earlier release that is still in certification is not touched (the Store keeps one pending
# submission): the job then fails with DEFERRED in its error and the pipeline tries again in an hour.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose MSIX to submit"
        required: true
      rollout:
        description: "Package rollout percentage, 1 to 100 (empty: repository variable STORE_ROLLOUT_PERCENT, else 10)"
        required: false
      diagnose:
        description: "Only print the current Partner Center submission (msstore submission get) and stop"
        type: boolean
        default: false
      commit:
        description: "Commit the submission to certification (false leaves a draft in Partner Center to review and send by hand)"
        type: boolean
        default: true
permissions:
  contents: read
# One submission at a time; a second one waits instead of overwriting the first draft.
concurrency:
  group: store-submit
  cancel-in-progress: false

jobs:
  # No secrets here (the Partner Center ones live in the `store` environment of the next job), so the token may be
  # able to write: a release that is still a draft (build-windows.yml creates drafts) is invisible to a read-only
  # token, and gh release download needs to see it.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      msix_file: ${{ steps.verify.outputs.msix_file }}
      msix_version: ${{ steps.verify.outputs.msix_version }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download the release and verify it
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "::error::unexpected tag: $TAG"; exit 1; }
          [ -n "$IDENTITY_NAME" ] || { echo "::error::repository variable MSIX_IDENTITY_NAME is not set"; exit 1; }
          mkdir -p dist && cd dist
          gh release download "$TAG" --repo "$REPO" --pattern 'PlainBrowser_*_x64.msix*' --pattern 'SHA256SUMS.txt*' --clobber
          [ "$(ls PlainBrowser_*_x64.msix | wc -l)" = 1 ] || { echo "::error::expected exactly one .msix on $TAG"; exit 1; }
          msix=$(ls PlainBrowser_*_x64.msix)
          # Only what sign-release.yml signed goes to the Store: same command SECURITY.md gives users.
          for f in SHA256SUMS.txt "$msix"; do
            [ -f "$f.bundle" ] || { echo "::error::$f.bundle missing: run sign-release on $TAG first"; exit 1; }
            cosign verify-blob --bundle "$f.bundle" \
              --certificate-identity-regexp "^https://github.com/$REPO/.github/workflows/sign-release.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
          grep -F " $msix" SHA256SUMS.txt | sha256sum -c -
          # A dev package (identity PlainBrowser.Dev) is the sign of a build without the MSIX_* variables.
          manifest=$(unzip -p "$msix" AppxManifest.xml)
          grep -q "<Identity Name=\"$IDENTITY_NAME\"" <<< "$manifest" \
            || { echo "::error::$msix does not carry the Store identity $IDENTITY_NAME"; exit 1; }
          version=$(grep -o '<Identity [^>]*Version="[^"]*"' <<< "$manifest" | sed 's/.*Version="//; s/"//')
          # the next job gets only the verified package, in a folder of its own for msstore
          cd .. && mkdir pkg && cp "dist/$msix" pkg/
          echo "msix_file=$msix" >> "$GITHUB_OUTPUT"
          echo "msix_version=$version" >> "$GITHUB_OUTPUT"
          echo "verified $msix, package version $version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-package
          path: pkg
          retention-days: 1
          if-no-files-found: error

  # msstore keeps its credentials in the system keyring: libsecret on Linux (missing on the runner image, the CLI then
  # fails with DllNotFoundException), Credential Manager on Windows, hence a Windows runner for this job.
  submit:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    environment: store
    steps:
      - uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-package
          path: pkg
      - name: Submit to Partner Center
        shell: bash
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          ROLLOUT: ${{ inputs.rollout || vars.STORE_ROLLOUT_PERCENT || '10' }}
          MSIX_FILE: ${{ needs.verify.outputs.msix_file }}
          MSIX_VERSION: ${{ needs.verify.outputs.msix_version }}
          # format() makes it the string 'false' (truthy); a plain `inputs.commit || 'true'` would turn false into 'true'.
          COMMIT: ${{ format('{0}', inputs.commit) }}
          DIAGNOSE: ${{ format('{0}', inputs.diagnose) }}
          CERT_NOTES: "Plain Browser is a Chromium-based desktop web browser packaged as a full-trust Win32 application (MSIX). It declares the restricted capability runFullTrust because the browser, GPU, network and utility processes run as ordinary desktop processes outside an AppContainer; the browser sandboxes its renderer processes itself. No other restricted capability is declared. Source code: https://github.com/plain-browser/plain-browser"
        run: |
          set -euo pipefail
          [ -n "$PRODUCT_ID" ] || { echo "::error::repository variable STORE_PRODUCT_ID is not set"; exit 1; }
          [[ "$ROLLOUT" =~ ^[0-9]+(\.[0-9]+)?$ ]] && awk "BEGIN{exit !($ROLLOUT >= 1 && $ROLLOUT <= 100)}" \
            || { echo "::error::rollout must be between 1 and 100: $ROLLOUT"; exit 1; }
          [ -f "pkg/$MSIX_FILE" ] || { echo "::error::pkg/$MSIX_FILE missing"; exit 1; }
          msstore reconfigure --tenantId "$TENANT_ID" --sellerId "$SELLER_ID" --clientId "$CLIENT_ID" --clientSecret "$CLIENT_SECRET"
          if [ "$DIAGNOSE" = true ]; then
            # FileUploadUrl is a short-lived write token for the package upload: the log is public, so not that line
            msstore submission get "$PRODUCT_ID" | sed -E 's/\x1b\[[0-9;]*m//g; s/("?FileUploadUrl"?( =|:) ).*/\1<redacted>/'
            exit 0
          fi
          # One pending submission at a time: leave an earlier one that is in review alone.
          status=$(msstore submission status "$PRODUCT_ID" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -o 'Submission Status = [A-Za-z]*' | head -1 | sed 's/.*= //' || true)
          echo "current Store submission status: ${status:-unknown}"
          case "$status" in
            PreProcessing|Certification|PendingPublication|Publishing|Release|CommitStarted)
              echo "::error::DEFERRED: the Store submission is still $status; the pipeline tries again in an hour"; exit 1 ;;
          esac
          # the first argument is the package file itself: msstore recognises a project by its type, and a .msix
          # is one (a directory with only a package in it is not: "could not find a project publisher")
          # Always without the commit: the submission is completed first (certification notes), then committed.
          msstore publish "pkg/$MSIX_FILE" -id "$PRODUCT_ID" --packageRolloutPercentage "$ROLLOUT" --noCommit
          if [ "$COMMIT" = true ]; then
            # The package declares the restricted capability runFullTrust (every Win32 app in an MSIX does); Partner
            # Center refuses the commit with an opaque "active validation errors" while the certification notes are
            # empty, and a new submission starts with empty notes. msstore only offers get -> edit -> updateMetadata.
            msstore submission get "$PRODUCT_ID" | sed 's/\x1b\[[0-9;]*m//g' | python -c '
          import json, os, sys
          text = sys.stdin.read()
          sub = json.JSONDecoder().raw_decode(text[text.index("{"):])[0]
          if not sub.get("NotesForCertification"):
              sub["NotesForCertification"] = os.environ["CERT_NOTES"]
          json.dump(sub, open("submission.json", "w"))
          print("NotesForCertification:", sub["NotesForCertification"][:80])
          '
            # their output is the whole submission, including the upload URL (a write token): keep it out of the log
            msstore submission updateMetadata "$PRODUCT_ID" submission.json > update.log 2>&1 || { sed -E 's/"FileUploadUrl".*/"FileUploadUrl": <redacted>/' update.log | tail -20; exit 1; }
            echo "submission metadata updated"
            msstore submission publish "$PRODUCT_ID" 2>&1 | sed -E 's/"FileUploadUrl".*/"FileUploadUrl": <redacted>/' | tail -8
            # `publish` returns at CommitStarted and Partner Center decides a few minutes later: wait for the verdict,
            # because a CommitFailed submission is not in certification and the pipeline must not treat it as done.
            for i in $(seq 1 40); do
              sleep 15
              status=$(msstore submission status "$PRODUCT_ID" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | grep -o 'Submission Status = [A-Za-z]*' | head -1 | sed 's/.*= //' || true)
              echo "Store submission status: ${status:-unknown}"
              case "$status" in
                CommitStarted|PendingCommit|"") ;;
                CommitFailed|PreProcessingFailed|CertificationFailed|PublishFailed|ReleaseFailed)
                  echo "::error::Store submission ended as $status"; exit 1 ;;
                *) break ;;
              esac
            done
            [ "$status" != CommitStarted ] && [ -n "$status" ] || { echo "::error::Store submission still CommitStarted after 10 minutes"; exit 1; }
          fi
          {
            echo "Submitted $MSIX_FILE (package version $MSIX_VERSION) to product $PRODUCT_ID"
            echo "- rollout: $ROLLOUT%"
            [ "$COMMIT" = true ] && echo "- committed to certification" || echo "- left as a draft in Partner Center"
          } >> "$GITHUB_STEP_SUMMARY"
