name: adblock-ffi
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The v1 tag with `toolchain: stable` instead of the action's `stable` branch: that branch is rewritten on every
      # Rust release, so a pin to one of its commits ends up on no branch (zizmor: impostor-commit).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo test --locked --manifest-path src/plainbrowser/adblock/rs/Cargo.toml
